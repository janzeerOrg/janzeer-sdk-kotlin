# Publishes the Dokka API reference to GitHub Pages (https://janzeerorg.github.io/janzeer-sdk-kotlin/) on every push to master
# (a release is always cut from master, so the reference matches the newest release), or by hand from the Actions tab. Kept apart
# from publish.yml so a Pages hiccup never needs a Maven Central re-run and vice versa. Not on the `release` event: the github-pages
# environment only accepts deployments from the default branch, and a release run carries the tag ref (rejected before step 1, 2026-10-28).
name: pages
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew dokkaGenerate --no-daemon
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/dokka/html
      - id: deploy
        uses: actions/deploy-pages@v4
