name: ci
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: run the e2e flow against JANZEER_NODE_URL (repository secrets)
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build dokkaGenerate --no-daemon
      - run: ./gradlew publishToMavenLocal -PRELEASE_SIGNING_ENABLED=false --no-daemon
  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :janzeer-sdk-client:e2eTest --no-daemon
        env:
          JANZEER_NODE_URL: ${{ secrets.JANZEER_NODE_URL }}
          JANZEER_RPC_URL: ${{ secrets.JANZEER_RPC_URL }}
          JANZEER_WS_URL: ${{ secrets.JANZEER_WS_URL }}
          JANZEER_E2E_MNEMONIC: ${{ secrets.JANZEER_E2E_MNEMONIC }}
          JANZEER_E2E_RECIPIENT: ${{ secrets.JANZEER_E2E_RECIPIENT }}
