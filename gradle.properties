org.gradle.jvmargs=-Xmx2g
kotlin.code.style=official
org.gradle.caching=true
org.gradle.parallel=true
# Maven Central (Sonatype Central Portal) — credentials come from the environment in CI:
#   ORG_GRADLE_PROJECT_mavenCentralUsername / ORG_GRADLE_PROJECT_mavenCentralPassword
#   ORG_GRADLE_PROJECT_signingInMemoryKey / ORG_GRADLE_PROJECT_signingInMemoryKeyPassword
SONATYPE_HOST=CENTRAL_PORTAL
RELEASE_SIGNING_ENABLED=true
POM_URL=https://github.com/janzeerorg/janzeer-sdk-kotlin
POM_SCM_URL=https://github.com/janzeerorg/janzeer-sdk-kotlin
POM_SCM_CONNECTION=scm:git:git://github.com/janzeerorg/janzeer-sdk-kotlin.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/janzeerorg/janzeer-sdk-kotlin.git
POM_LICENSE_NAME=The Apache License, Version 2.0
POM_LICENSE_URL=https://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
POM_DEVELOPER_ID=janzeer
POM_DEVELOPER_NAME=Janzeer
POM_DEVELOPER_URL=https://janzeer.org

org.jetbrains.dokka.experimental.gradle.pluginMode=V2Enabled
